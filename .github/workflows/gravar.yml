name: Gravador

on:
  workflow_dispatch: # Permite rodar manualmente a qualquer momento
  schedule:
    - cron: '*/15 * * * *' # Checa a cada 15 minutos se o streamer está online

jobs:
  record:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install streamlink

    - name: Executar o robô de gravação
      run: python gravador_chat.py

    - name: Salvar arquivo JSON gravado no GitHub
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Chat gravado gerado automaticamente"
        file_pattern: "*.json"
