name: Gravador

on:
  workflow_dispatch: # Permite rodar manualmente a qualquer momento
  schedule:
    - cron: '*/15 * * * *' # Checa a cada 15 minutos se o streamer está online

jobs:
  gravar:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar código do repositório
      uses: actions/checkout@v4

    - name: Configurar ambiente Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependências necessárias
      run: |
        python -m pip install --upgrade pip
        pip install streamlink

    - name: Executar robô de gravação
      run: python gravador_chat.py

    - name: Salvar arquivo JSON nos Artefatos
      if: always() # Salva o arquivo mesmo que a gravação seja interrompida
      uses: actions/upload-artifact@v4
      with:
        name: chat-logs-json
        path: "*.json"
        retention-days: 7
