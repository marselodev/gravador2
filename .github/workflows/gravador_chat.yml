name: Gravador de Chat Twitch

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  gravar_e_salvar:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install streamlink

      - name: Configurar Fuso Horário Brasil
        run: sudo timedatectl set-timezone America/Sao_Paulo

      - name: Verificar Horário Permitido (14h às 22h)
        run: |
          HORA_ATUAL=$(date +%H)
          echo "Hora atual no Brasil: ${HORA_ATUAL}h"
          if [ "$HORA_ATUAL" -lt 14 ] || [ "$HORA_ATUAL" -ge 22 ]; then
            echo "[!] Fora do horário de funcionamento (14h às 22h). Encerrando."
            exit 0
          fi

      - name: Executar o seu Gravador de Chat
        run: python3 gravador_chat.py

      - name: Salvar Chat como Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-twitch-snopey
          path: chat_*.json
