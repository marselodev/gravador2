name: Gravador 2

on:
  schedule:
    # Roda a cada 15 minutos, entre 14:00 e 22:59 (Horário de Brasília)
    - cron: '*/15 17-23,0-1 * * *'
  workflow_dispatch:

# Evita que o GitHub abra duas gravações ao mesmo tempo
concurrency:
  group: gravacao_2
  cancel-in-progress: false

jobs:
  gravar_tudo:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      - name: Configurar Fuso Horario Brasil
        run: sudo timedatectl set-timezone America/Sao_Paulo

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependencias (Streamlink e Rclone)
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          pip install --upgrade streamlink

      - name: Configurar o Google Drive (Rclone)
        run: |
          mkdir -p ~/.config/rclone
          cat << 'EOF' > ~/.config/rclone/rclone.conf
          ${{ secrets.RCLONE_CONFIG_DATA }}
          EOF

      - name: Gravar Video e Chat Sincronizados
        run: |
          echo "Checando se o canal snopey esta ao vivo..."
          DATA=$(date +%d-%m-%Y_%H-%M)
          
          # 1. Checa a Twitch primeiro
          if streamlink twitch.tv/snopey best --stream-url > /dev/null 2>&1; then
            echo "Canal online na Twitch! Iniciando gravacao sincronizada..."
            python gravador3.py &
            CHAT_PID=$!
            sleep 3
            timeout -s INT 240m streamlink twitch.tv/snopey best --twitch-disable-hosting --twitch-low-latency -o "live_twitch2_${DATA}.mp4" || true
            
            kill -SIGINT $CHAT_PID 2>/dev/null || true
            sleep 5

          # 2. Se nao estiver na Twitch, checa a Kick
          elif streamlink kick.com/snopey best --stream-url > /dev/null 2>&1; then
            echo "Canal online na Kick! Iniciando gravacao sincronizada..."
            python gravador3.py &
            CHAT_PID=$!
            sleep 3
            timeout -s INT 240m streamlink kick.com/snopey best -o "live_kick2_${DATA}.mp4" || true
            
            kill -SIGINT $CHAT_PID 2>/dev/null || true
            sleep 5

          else
            echo "Canal offline na Twitch e na Kick. Nenhuma gravacao iniciada."
          fi

      - name: Enviar Video E Chat para o Google Drive
        if: always()
        run: |
          if ls *.mp4 1> /dev/null 2>&1; then
            echo "Ativando proxy Cloudflare WARP para evitar bloqueio de IP..."
            curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
            echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
            sudo apt-get update && sudo apt-get install -y cloudflare-warp
            warp-cli --accept-tos registration new
            warp-cli --accept-tos mode proxy
            warp-cli --accept-tos proxy port 40000
            warp-cli --accept-tos connect
            sleep 5

            echo "Enviando arquivos para o Google Drive..."
            ALL_PROXY=socks5://127.0.0.1:40000 rclone copy . gdrive01:Lives_Gravadas \
              --include "*.mp4" \
              --include "*.json" \
              --drive-chunk-size 64M \
              --tpslimit 2 \
              --bwlimit 70M \
              --retries 10 \
              --low-level-retries 20 \
              -v

            rm -f *.mp4 *.json
          else
            echo "Nenhum arquivo para enviar."
          fi
